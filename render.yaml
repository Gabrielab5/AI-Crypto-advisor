services:
  - type: web
    name: ai-crypto-advisor-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    preDeployCommand: node db/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: CRYPTOPANIC_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false          #  Vercel URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    healthCheckPath: /health
